name: Inspect Modrinth project content

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modrinth-v0.1.0-alpha.9
  cancel-in-progress: false

jobs:
  restore:
    if: github.repository == 'DebZakari/Vultrum'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect project content and version order
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          sys.path.insert(0, 'tools')
          import publish_modrinth as publisher

          project_id = 'LV34xpJ5'
          token = os.environ['MODRINTH_TOKEN']
          project = publisher.modrinth(f'/project/{project_id}', token)
          assert project['id'] == project_id and project['title'] == 'Vultrum'
          versions = publisher.project_versions(project_id, token)
          print('VERSIONS=' + json.dumps([
              {key: item[key] for key in ('id', 'name', 'version_number', 'date_published')}
              for item in sorted(versions, key=lambda item: item['date_published'])]))
          print('PROJECT_CONTENT=' + json.dumps({
              key: project.get(key) for key in ('id', 'status', 'description', 'body', 'gallery')}))
          PY
